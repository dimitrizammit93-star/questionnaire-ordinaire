<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Affiche questionnaire</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/BarlowCondensed-Bold.ttf) format("truetype")}
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1d1b19;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.a4{width:210mm;min-height:297mm;margin:0 auto;padding:22mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{background:#1a1a1a;color:#ffcb05;font-weight:800;letter-spacing:.08em;padding:6px 14px;border-radius:999px;font-size:14px}
h1{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:64px;line-height:.95;margin:18px 0 12px}
.logo{width:58mm;height:auto}
.band{width:100%;height:5mm;background:linear-gradient(90deg,#00a04a 0 50%,#ffcb05 50% 100%);margin:6mm 0 0}
p.l{font-size:21px;color:#4a4540;max-width:150mm;margin:0 0 28px}
#qr{padding:14px;border:3px solid #1d1b19;border-radius:18px}
.url{font-size:16px;color:#6b655f;margin-top:14px;word-break:break-all}
ul{list-style:none;padding:0;margin:30px 0 0;font-size:20px;display:grid;gap:10px}
ul li::before{content:"✓  ";color:#00a04a;font-weight:800}
.pied{margin-top:auto;font-size:14px;color:#6b655f}
.noprint{position:fixed;top:10px;right:10px}
.noprint button{padding:10px 16px;font:inherit;font-weight:700;border:0;border-radius:10px;background:#00a04a;color:#fff;cursor:pointer}
@media print{.noprint{display:none}}
</style>
</head>
<body>
<div class="noprint"><button onclick="print()">Imprimer</button></div>
<div class="a4">
  <img class="logo" src="logo.svg" alt="">
  <span class="tag">ORDINAIRE · 6e COMPAGNIE</span>
  <h1>Les repas,<br>c'est vous qui jugez</h1>
  <p class="l">Grenelle, Auteuil, Issy : donnez votre avis sur la qualité et la quantité des repas pour faire évoluer les menus.</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <ul><li>Anonyme</li><li>5 minutes sur téléphone</li><li>Résultats partagés à la compagnie</li></ul>
  <p class="pied">Bureau RHL · CS Grenelle</p>
  <div class="band"></div>
</div>
<script>
const u = location.origin + "/";
document.getElementById("url").textContent = u.replace(/^https?:\/\//, "");
new QRCode(document.getElementById("qr"), { text: u, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
