<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questionnaire ordinaire</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#00a04a">
<link rel="stylesheet" href="style.css">
<style>
.etape{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:-6px 0 12px}
.menu{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
.menu h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.menu h3:first-child{margin-top:0}
.plat{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
.plat.plus{background:#e3f3e9;border-color:var(--ok);color:#174d2e}
.plat.moins{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
@media (prefers-color-scheme:dark){.plat.plus{background:#163223;color:#9fe0b8}}
.menu .row{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.champ{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:transparent;color:var(--ink);margin-bottom:8px}
.welcome p{margin:0 0 12px}
.welcome .logo-accueil{display:block;width:84px;height:auto;margin:4px auto 14px}
.welcome h2{text-align:center;margin-bottom:14px}
.welcome .signature{color:var(--muted);font-style:italic;margin:16px 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="logo" src="logo.svg" alt="" width="46" height="54">
    <div><h1>L'ordinaire, votre avis</h1><p class="sub">Anonyme · 5 minutes · Grenelle, Auteuil, Issy</p></div>
  </header>
  <div class="prog"><i id="prog"></i></div>
  <main id="app"></main>
</div>
<script src="config.js"></script>
<script>
const R = {}; let etape = -1;
const app = document.getElementById("app");
const deja = (() => { try { return localStorage.getItem("ordinaire_repondu") } catch { return null } })();
const ENCOURAGE = [];

const ok = s => !s.show || s.show(R);
const etapes = () => SECTIONS.filter(ok);
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
function pill(label, on, fn, cls = "opt"){ const b = el("button", cls + (on ? " on" : ""), label); b.type = "button"; b.onclick = fn; return b }

function rendreQuestion(q){
  const box = el("div", "q");
  const t = el("div", "qt", q.t); if (q.req) t.appendChild(el("span", "req", " *"));
  box.appendChild(t);
  if (q.type === "radio") {
    const o = el("div", "opts");
    q.o.forEach(x => o.appendChild(pill(x, R[q.id] === x, () => { R[q.id] = R[q.id] === x ? undefined : x; rendre() })));
    box.appendChild(o);
  } else if (q.type === "check") {
    const o = el("div", "opts"), cur = R[q.id] || [];
    q.o.forEach(x => o.appendChild(pill(x, cur.includes(x), () => {
      let v = R[q.id] || [];
      if (v.includes(x)) v = v.filter(y => y !== x);
      else v = x === q.x ? [x] : [...v.filter(y => y !== q.x), x];
      R[q.id] = v; rendre();
    })));
    box.appendChild(o);
  } else if (q.type === "notes") {
    const cur = R[q.id] || {};
    q.c.forEach(c => {
      const row = el("div", "row"); row.appendChild(el("span", "", c));
      const s = el("div", "scale");
      [1,2,3,4,5].forEach(n => s.appendChild(pill(String(n), cur[c] === n, () => { R[q.id] = { ...(R[q.id]||{}), [c]: n }; rendre() })));
      row.appendChild(s); box.appendChild(row);
    });
  } else if (q.type === "scale10") {
    const s = el("div", "scale10");
    for (let n = 1; n <= 10; n++) s.appendChild(pill(String(n), R[q.id] === n, () => { R[q.id] = n; rendre() }));
    box.appendChild(s);
  } else if (q.type === "menu") {
    const cur = R[q.id] || { plus: [], moins: [] };
    const m = el("div", "menu");
    [["☀️ Midi", q.midi], ["🌙 Soir", q.soir]].forEach(([titre, plats]) => {
      m.appendChild(el("h3", "", titre));
      const o = el("div", "opts");
      plats.forEach(p => {
        const etat = cur.plus.includes(p) ? "plus" : cur.moins.includes(p) ? "moins" : "";
        const b = el("button", "plat " + etat, (etat === "plus" ? "👍 " : etat === "moins" ? "👎 " : "") + p);
        b.type = "button";
        b.onclick = () => {
          const v = { note: cur.note, plus: cur.plus.filter(x => x !== p), moins: cur.moins.filter(x => x !== p) };
          if (etat === "") v.plus.push(p); else if (etat === "plus") v.moins.push(p);
          R[q.id] = v; rendre();
        };
        o.appendChild(b);
      });
      m.appendChild(o);
    });
    const row = el("div", "row"); row.appendChild(el("span", "", "Note de la semaine"));
    const s = el("div", "scale");
    [1,2,3,4,5].forEach(n => s.appendChild(pill(String(n), cur.note === n, () => { R[q.id] = { ...cur, note: n }; rendre() })));
    row.appendChild(s); m.appendChild(row);
    box.appendChild(m);
  } else if (q.type === "multitext") {
    const cur = R[q.id] || {};
    q.c.forEach(c => {
      const inp = el("input"); inp.type = "text"; inp.placeholder = c; inp.value = cur[c] || ""; inp.maxLength = 200; inp.className = "champ";
      inp.oninput = () => { const v = { ...(R[q.id] || {}) }; if (inp.value.trim()) v[c] = inp.value; else delete v[c]; R[q.id] = Object.keys(v).length ? v : undefined };
      box.appendChild(inp);
    });
  } else {
    const ta = el("textarea"); ta.value = R[q.id] || ""; ta.maxLength = 1000; ta.placeholder = "Facultatif";
    ta.oninput = () => { R[q.id] = ta.value };
    box.appendChild(ta);
  }
  return box;
}

const vide = v => v == null || v === "" || (Array.isArray(v) && !v.length);
function manquants(sec){ return sec.qs.filter(q => q.req && ok(q) && vide(R[q.id])) }

function accueil(){
  document.getElementById("prog").style.width = "0%";
  app.innerHTML = `<section class="card welcome">
    <img class="logo-accueil" src="logo.svg" alt="Ordinaire 6e compagnie">
    <h2>L'ordinaire, on en parle tous</h2>
    <p>Au bureau RHL, on a entendu les remarques sur les repas, à Grenelle comme dans les satellites. Plutôt que d'en discuter à table, on veut des retours précis pour retravailler les menus avec la cuisine.</p>
    <p>Le questionnaire est anonyme et prend 5 minutes. Les résultats seront présentés à la compagnie, avec ce qui va changer.</p>
    <p class="signature">Le bureau RHL · CS Grenelle</p>
    <button class="btn pri" id="go" style="width:100%">Commencer</button></section>`;
  document.getElementById("go").onclick = () => { etape = 0; rendre(); scrollTo(0, 0) };
}

function rendre(msg){
  const y = window.scrollY;
  const E = etapes(); if (etape >= E.length) etape = E.length - 1;
  app.innerHTML = "";
  document.getElementById("prog").style.width = ((etape + 1) / (E.length + 1) * 100) + "%";
  const info = el("div", "etape"); info.appendChild(el("span", "", `Étape ${etape + 1} / ${E.length}`)); info.appendChild(el("span", "", ENCOURAGE[Math.min(etape, ENCOURAGE.length - 1)] || ""));
  app.appendChild(info);
  const sec = E[etape];
  const card = el("section", "card");
  card.appendChild(el("h2", "", sec.titre));
  if (sec.intro) card.appendChild(el("p", "intro", sec.intro));
  sec.qs.filter(ok).forEach(q => card.appendChild(rendreQuestion(q)));
  if (msg) card.appendChild(el("div", "err", msg));
  app.appendChild(card);
  const bar = el("div", "bar");
  if (etape > 0) { const p = el("button", "btn sec", "Précédent"); p.onclick = () => { etape--; rendre(); scrollTo(0,0) }; bar.appendChild(p) }
  const fin = etape === E.length - 1;
  const n = el("button", "btn pri", fin ? "Envoyer ✓" : "Suivant");
  n.onclick = () => {
    if (manquants(sec).length) return rendre("Merci de répondre aux questions marquées *.");
    if (fin) return envoyer(n);
    etape++; rendre(); scrollTo(0,0);
  };
  bar.appendChild(n); app.appendChild(bar);
  window.scrollTo(0, y);
}

async function envoyer(btn){
  btn.disabled = true; btn.textContent = "Envoi…";
  const data = {};
  etapes().forEach(s => s.qs.forEach(q => { if (ok(q) && !vide(R[q.id])) data[q.id] = R[q.id] }));
  try {
    const r = await fetch("/api/reponse", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
    if (!r.ok) throw new Error((await r.json()).erreur || "Erreur");
    try { localStorage.setItem("ordinaire_repondu", "1") } catch {}
    merci();
  } catch (e) { btn.disabled = false; btn.textContent = "Envoyer ✓"; rendre("Envoi impossible (" + e.message + "). Vérifiez le réseau et réessayez."); }
}

function merci(){
  document.getElementById("prog").style.width = "100%";
  app.innerHTML = '<section class="card center"><h2>Merci, c\'est enregistré</h2><p class="intro">Les résultats seront présentés à la compagnie, avec ce qui change dans les menus.</p><p class="intro"><i>Le bureau RHL</i></p></section>';
}

if (deja) app.innerHTML = '<section class="card center"><h2>Vous avez déjà répondu 👍</h2><p class="intro">Merci pour votre participation.</p><button class="btn sec" id="re">Répondre à nouveau</button></section>', document.getElementById("re").onclick = accueil;
else accueil();
</script>
</body>
</html>
